name: CI

on:
  push: 
    branches:
      - main
      - dev
  pull_request:
    branches: 
      - main
      - dev

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18  # keep in sync with docker-compose.yml
        env:
          POSTGRES_USER: meal
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: meal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal -d meal"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://meal:ci-password@localhost:5432/meal
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789

    steps:
    - uses: actions/checkout@v7

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      with:
        enable-cache: true
    
    - name: Install dependencies
      run: uv sync --locked

    - name: Lint
      run: |
        uv run ruff check .
        uv run ruff format --check .

    - name: Type checking
      run: uv run mypy .

    - run: uv run alembic upgrade head

    - run: uv run alembic check # checks if current database matches code
    
    - name: Tests
      run: uv run pytest -q

