<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Ordering Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Noto+Sans+TC:wght@100..900&display=swap" rel="stylesheet">
<style>
:root{
  --w:#FFFFFF; --pur:#5B2A86; --pur-ink:#45206A; --pur-tint:#F1EBF7;
  --ink:#1B1426; --mute:#655E70; --faint:#B3ABBD; --rule:#E6E1EC; --fill:#F7F5FA;
  --amb:#8F5E00; --amb-bar:#E0A100; --grn:#17703F; --red:#B42828; --red-tint:#FBEDED;
  --desk:#ECE7F2; --lilac:#FAF8FC; --lav:#D9C8EE; --sun:#FFC23D; --sun-ink:#3D2A00;
  --num:"Archivo","Noto Sans TC",system-ui,sans-serif;
  --snap:90ms steps(2,end);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--desk);color:var(--ink);font:16px/1.45 "Noto Sans TC",system-ui,sans-serif;caret-color:var(--pur);min-height:100vh}
::selection{background:var(--pur-tint);color:var(--pur-ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--pur);outline-offset:2px;border-radius:3px}
.num{font-family:var(--num);font-stretch:78%;font-variant-numeric:tabular-nums}
.lab{font:700 11px/1.2 var(--num);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.lab:lang(zh-Hant){letter-spacing:.04em;font-size:12px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* stage */
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding:40px 24px}
.device{width:390px;height:844px;border-radius:44px;background:var(--w);box-shadow:0 0 0 10px var(--ink),0 24px 60px rgba(27,20,38,.28);overflow:hidden;flex:none}
.app{height:100%;display:flex;flex-direction:column;background:var(--lilac)}
@media (max-width:899px){
  .stage{flex-direction:column;align-items:stretch;padding:0;gap:0}
  .device{width:100%;height:100dvh;border-radius:0;box-shadow:none}
}

/* chrome */
.hdr{display:flex;align-items:center;gap:10px;padding:12px 16px 12px 20px;min-height:64px;flex:none;background:var(--pur);color:#fff}
.hdr .back{width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;border-radius:6px}
.hdr .back:hover{background:rgba(255,255,255,.14)}
.hdr :focus-visible{outline-color:#fff}
.hdr .ttl{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.hdr .ttl .no{font-weight:700;font-size:15px;color:#fff;border-radius:4px;padding:1px 7px;align-self:center;background:var(--sc,rgba(255,255,255,.2))}
.hdr h1{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tog{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:10px;overflow:hidden;flex:none}
.tog button{font-size:13px;padding:0 12px;min-width:44px;height:32px;color:#EDE4F7}
.tog button[aria-pressed=true]{background:#fff;color:var(--pur);font-weight:700}
main{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
main::-webkit-scrollbar{width:6px}main::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.meta{padding:12px 20px 0;font-size:13px;color:var(--mute);display:flex;justify-content:space-between;gap:12px}
.sample{font:700 11px var(--num);letter-spacing:.12em;color:var(--mute);white-space:nowrap}
.sec{padding:28px 20px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:15px;font-weight:700}
.sec span{font-size:13px;color:var(--mute)}
.stack{display:grid;gap:10px;padding:0 20px}

.tabbar{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--rule);background:var(--w);padding-bottom:env(safe-area-inset-bottom);flex:none}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 12px;font-size:12px;color:var(--mute);position:relative}
.tabbar button[aria-current=page]{color:var(--pur);font-weight:700}
.badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:5px;background:var(--sun);color:var(--sun-ink)!important;color:#fff;font:700 11px/18px var(--num);padding:0 5px}

/* the pass */
.pass{border:0;border-radius:14px;background:var(--w);display:block;width:100%;text-align:left;--bgp:var(--lilac);box-shadow:0 1px 2px rgba(27,20,38,.06),0 6px 18px rgba(91,42,134,.10);overflow:visible}
button.pass:hover{box-shadow:0 1px 2px rgba(27,20,38,.08),0 10px 24px rgba(91,42,134,.16)}
.pass .top{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px 16px;align-items:end;background:var(--band,var(--pur));color:#fff;border-radius:14px 14px 0 0;position:relative;overflow:hidden}
.pass .top:after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:18px solid rgba(255,255,255,.07);pointer-events:none}
.pass .top .lab{color:var(--lav)}
.pass .code{font:800 52px/0.9 var(--num);font-stretch:78%;color:#fff;letter-spacing:.01em}
.pass .code .pfx{color:var(--sun)}
.pass .stat{text-align:right}
.pass .stat b{display:inline-block;font-size:17px;font-weight:700;line-height:1;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.16);color:#fff}
.pass .stat small{display:block;font-size:13px;color:var(--lav);margin-top:6px}
.perf{border-top:1px dashed #D5CDDF;position:relative;height:0}
.perf:before,.perf:after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bgp);border:1px solid var(--rule)}
.perf:before{left:-10px;clip-path:inset(0 0 0 50%)}.perf:after{right:-10px;clip-path:inset(0 50% 0 0)}
.legs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 13px}
.legs i{display:block;height:4px;border-radius:2px;background:var(--rule)}
.legs span{display:block;font-size:12px;color:var(--mute);margin-top:6px;white-space:nowrap}
.legs .d i{background:var(--pur)}
.legs .n span{color:var(--ink);font-weight:700}
.s-confirming .legs .n i{background:var(--pur)}
.s-preparing .legs .n i{background:var(--sun)}
.s-ready .legs .n i,.s-ready .legs .d i{background:var(--grn)}
.s-preparing .stat b{background:var(--sun);color:var(--sun-ink)}
.s-ready{--band:var(--grn)}
.s-ready .stat b{background:#fff;color:var(--grn)}
.s-cancelled{--band:#8A8395}
.s-cancelled .stat b{background:#fff;color:var(--red)}
.s-cancelled .code .pfx{color:#fff}
.s-cancelled .code{color:#E9E5EE;text-decoration:line-through;text-decoration-thickness:3px}
.pass.mini .code{font-size:40px}
.pass.mini .stat b{font-size:15px;padding:6px 10px}
.snapping .stat b,.snapping .legs .n i,.snapping .legs .d i{animation:snap var(--snap)}
@keyframes snap{0%{opacity:.3;transform:translateY(2px)}100%{opacity:1;transform:none}}

/* stalls */
.stall{display:grid;grid-template-columns:44px 1fr auto;gap:2px 14px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:var(--w)}
.stall:hover{background:var(--fill)}
.stall .op b.on{color:var(--grn)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 24px}
.scard{background:var(--w);border-radius:8px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(27,20,38,.06),0 4px 14px rgba(91,42,134,.08)}
.scard:hover{box-shadow:0 1px 2px rgba(27,20,38,.08),0 8px 22px rgba(91,42,134,.16)}
.scard .img{position:relative;aspect-ratio:4/3;background:color-mix(in srgb,var(--sc) 14%,#fff);display:grid;place-items:center;color:color-mix(in srgb,var(--sc) 70%,#fff)}
.scard .img .ico{width:30px;height:30px;stroke-width:1.5}
.scard .img .phl{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:color-mix(in srgb,var(--sc) 75%,#000)}
.scard .tile{position:absolute;top:8px;left:8px;font:800 16px var(--num);font-stretch:78%;color:#fff;background:var(--sc);border-radius:5px;padding:3px 8px}
.scard .body{padding:10px 12px 12px;display:grid;gap:2px}
.scard .nm{font-size:16px;font-weight:700}
.scard .mt{font-size:12px;color:var(--mute)}
.scard .st{font-size:12px;font-weight:700;margin-top:4px;display:flex;justify-content:space-between;gap:6px}
.scard .st .on{color:var(--grn)}
.scard .st .off{color:var(--mute)}
.scard .st .cartn{color:var(--pur)}
.scard.closed .img{filter:grayscale(1);opacity:.7}
.scard.closed .nm{color:var(--mute)}
.stall .no{font:800 20px var(--num);font-stretch:78%;color:#fff;background:var(--sc);grid-row:span 2;width:44px;height:44px;border-radius:6px;display:grid;place-items:center}
.stall .nm{font-size:17px;font-weight:500}
.stall .mt{font-size:13px;color:var(--mute)}
.stall .op{font-size:13px;grid-row:span 2;text-align:right;display:grid;gap:2px}
.stall .op b{font-weight:500}
.stall .cartn{color:var(--pur);font-weight:700}
.stall.closed .nm{color:var(--mute)}
.stall.closed .no{background:#B3ABBD}

/* menu */
.tabs{display:flex;gap:24px;padding:0 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--lilac);z-index:2;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:14px 0 11px;color:var(--mute);white-space:nowrap;font-size:15px}
.tabs button[aria-current=true]{color:var(--pur);font-weight:700;box-shadow:inset 0 -3px 0 var(--pur)}
.hero{position:relative}
.hero .sample{position:absolute}
.hero .on{color:var(--grn);font-weight:700}.hero .off{color:var(--mute);font-weight:700}
.himg{position:relative;display:grid;place-items:center;aspect-ratio:16/9;background:color-mix(in srgb,var(--sc) 16%,#fff);color:color-mix(in srgb,var(--sc) 70%,#fff)}
.himg .ico{width:36px;height:36px;stroke-width:1.5}
.himg .phl{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:12px;color:color-mix(in srgb,var(--sc) 75%,#000)}
.hero.closed .himg{filter:grayscale(1);opacity:.75}
.desc{font-size:15px;line-height:1.5}
.hero .mt{font-size:13px;color:var(--mute);margin-top:4px}
/* B: image + overlapping card */
.hb{padding-bottom:4px}
.hb .himg{aspect-ratio:auto;height:170px}
.hb .himg .phl{bottom:auto;top:12px}
.hb .hcard{position:relative;margin:-44px 16px 0;background:var(--w);border-radius:8px;padding:14px 16px 16px;box-shadow:0 1px 2px rgba(27,20,38,.06),0 6px 18px rgba(91,42,134,.12)}
.hb .hrow{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hb .tile{font-weight:800;font-size:16px;color:#fff;background:var(--sc);border-radius:5px;padding:3px 8px}
.hb h2{font-size:20px}
.hb .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hb .chips span{font-size:12px;background:var(--pur-tint);color:var(--pur-ink);border-radius:10px;padding:4px 10px}
.hb .chips span .on,.hb .chips span .off{font-weight:700}
.hb .sample{right:16px;top:14px;position:absolute}
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 20px 8px}
.icard{background:var(--w);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(27,20,38,.06),0 4px 14px rgba(91,42,134,.08)}
.iimg{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 12%,#fff);color:color-mix(in srgb,var(--sc) 65%,#fff)}
.iimg .ico{width:28px;height:28px;stroke-width:1.5}
.iimg .phl{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:color-mix(in srgb,var(--sc) 75%,#000)}
.iimg .sold{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px}
.ibody{padding:10px 10px 10px 12px;display:flex;flex-direction:column;gap:2px;flex:1}
.ibody .nm{font-size:15px;line-height:1.35;font-weight:500;min-height:2.7em}
.ifoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px;min-height:40px}
.ifoot .p{font:600 19px var(--num);font-stretch:78%;font-variant-numeric:tabular-nums}
.icard .step{height:36px}.icard .step button{width:32px}.icard .step output{min-width:16px;font-size:15px}
.icard .add{width:36px;height:36px}
.icard.out .iimg{background:#EFEDF2;color:#B3ABBD}
.icard.out .nm,.icard.out .p{color:var(--mute)}
.icard.out .p{text-decoration:line-through}
.cat{padding:24px 20px 4px;font-size:13px;font-weight:700;color:var(--mute)}
.item{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 20px;min-height:64px;border-bottom:1px solid var(--rule);background:var(--w)}
.item .nm{font-size:17px;line-height:1.3}
.item .p{font:600 20px var(--num);font-stretch:78%;font-variant-numeric:tabular-nums}
.item.out .nm,.item.out .p{color:var(--mute)}
.item .tag{font-size:13px;color:var(--mute);grid-column:2/4;justify-self:end}
.warn{display:block;font-size:12px;color:var(--red);margin-top:2px;font-weight:500}
.step{display:flex;align-items:center;border:0;background:var(--pur);color:#fff;border-radius:10px;height:40px}
.step button{width:40px;height:100%;display:grid;place-items:center;border-radius:10px}
.step button:hover{background:rgba(255,255,255,.16)}
.step output{min-width:20px;text-align:center;font:700 16px var(--num);font-variant-numeric:tabular-nums}
.add{width:40px;height:40px;border:1.5px solid var(--pur);color:var(--pur);border-radius:6px;display:grid;place-items:center;background:var(--w)}
.add:hover{background:var(--pur-tint)}
.add:disabled{border-color:var(--rule);color:var(--faint);background:none}

.note{margin:14px 20px 0;padding:12px 14px;border-radius:5px;background:var(--fill);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.note.err{background:var(--red-tint);color:#7E1C1C}
.note .act{margin-left:auto;font-weight:700;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;padding:0 2px}

.cta{margin:12px 16px 16px;height:56px;border-radius:10px;background:var(--pur);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700;font-size:17px;width:calc(100% - 32px);flex:none}
.cta:hover:not(:disabled){background:var(--pur-ink)}
.cta:disabled{background:#CFC6DA}
.cta.center{justify-content:center;gap:10px}
.cta .num{font-size:22px}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* checkout */
.line{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--rule);min-height:64px;background:var(--w)}
.line .sub{font:600 18px var(--num);font-stretch:78%;min-width:52px;text-align:right}
.line.bad .nm s,.line.bad .sub{color:var(--mute)}
.line.bad .sub{text-decoration:line-through}
.line .rm{font-size:14px;font-weight:700;color:var(--red);padding:10px 4px;text-decoration:underline;text-underline-offset:3px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px}
.sum b{font:800 28px var(--num);font-stretch:78%}
.ph{margin:0 20px;border:1px dashed #CFC6DA;border-radius:6px;padding:14px 16px;font-size:14px;color:var(--mute);display:flex;gap:12px}
.ph + .ph{margin-top:10px}
.ph strong{display:block;color:var(--ink);font-size:15px;margin-bottom:2px}

/* full pass */
.passwrap{padding:20px;min-height:100%}
.passwrap .pass .code{font-size:84px}
.passwrap .pass .top{padding:20px 18px 20px}
.passwrap .pass .stat b{font-size:20px;padding:8px 14px}
.fields{display:grid;grid-template-columns:1.4fr 1fr .7fr;gap:12px;padding:14px 18px 16px}
.fields dd{font-size:15px;margin-top:3px}

.rule{border-top:1px solid var(--rule);margin:0 18px}
.lines{padding:14px 18px 16px;font-size:14px}
.lines div{display:flex;justify-content:space-between;padding:3px 0}
.lines .t{border-top:1px solid var(--rule);margin-top:8px;padding-top:10px;font-weight:700}
.msg{margin-top:18px;font-size:15px;text-align:center;color:var(--mute)}
.msg.ready{color:var(--grn);font-weight:700;font-size:17px}
.msg.cancel{color:var(--red);font-weight:700}
.upd{margin-top:8px;text-align:center;font-size:13px;color:var(--mute);display:flex;gap:6px;justify-content:center;align-items:center}
.upd.off{color:var(--red)}

/* orders */
.hist{display:grid;grid-template-columns:72px 1fr auto;gap:2px 12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);width:100%;text-align:left;background:var(--w)}
.hist:hover{background:var(--fill)}
.hist .code{font:700 20px var(--num);font-stretch:78%;color:var(--mute);grid-row:span 2}
.hist .mt{font-size:13px;color:var(--mute)}
.hist .r{grid-row:span 2;text-align:right;font-size:13px}
.hist .r b{display:block;font:600 17px var(--num);font-stretch:78%}
.hist .x{color:var(--red)}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty button{margin-top:12px;color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:10px}

/* demo panel */
.demo{width:300px;background:var(--w);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(27,20,38,.08);font-size:14px;position:sticky;top:40px}
.demo h2{font-size:15px;margin-bottom:4px}
.demo p{color:var(--mute);font-size:13px}
.demo .lbl{display:block;font-size:12px;color:var(--mute);margin:16px 0 6px}
.demo select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--w);color:var(--ink)}
.demo .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo .row + .row{margin-top:8px}
.demo button{border:1px solid var(--rule);border-radius:8px;padding:9px 10px;text-align:left;font-size:13px;background:var(--w);min-height:40px}
.demo button:hover:not(:disabled){border-color:var(--pur);color:var(--pur)}
.demo button:disabled{color:var(--faint)}
.demo button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.demo .wide{grid-column:1/3}
@media (max-width:899px){.demo{width:auto;border-radius:0;position:static;box-shadow:none;border-top:8px solid var(--desk)}}
/* auth + onboarding */
.auth{flex:1;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin}
.ahero{background:var(--pur);color:#fff;padding:18px 20px 64px;position:relative;overflow:hidden;flex:none}
.ahero:after{content:"";position:absolute;right:-60px;top:-50px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.07);pointer-events:none}
.ahero .bar{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.ahero .bar .back{width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;border-radius:6px;color:#fff}
.ahero .bar .back:hover{background:rgba(255,255,255,.14)}
.ahero h1{font-size:28px;line-height:1.25;font-weight:700;margin-top:28px;position:relative;z-index:1}
.ahero h1 .pfx{color:var(--sun)}
.ahero p{color:#E7DCF3;font-size:15px;margin-top:8px;position:relative;z-index:1;max-width:34ch}
.acard{background:var(--w);margin:-36px 16px 24px;border-radius:8px;padding:22px 18px 20px;position:relative;box-shadow:0 1px 2px rgba(27,20,38,.06),0 8px 24px rgba(91,42,134,.12)}
.acard h2{font-size:20px;font-weight:700}
.acard .sub{font-size:14px;color:var(--mute);margin-top:4px}
.field{display:grid;gap:6px;margin-top:18px}
.field > label{font-size:14px;font-weight:700}

.obfoot{padding:8px 16px 16px;flex:none}

.ogroup legend small,.ogroup .legend small{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:2px}
.ogroup legend + *{clear:both}
.ochk{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);cursor:pointer;clear:both}
.ochk input{position:absolute;opacity:0;width:1px;height:1px}

.ochk .box .ico{width:16px;height:16px;stroke-width:2.6}
.ochk input:checked + .box{background:var(--pur);border-color:var(--pur);color:#fff}
.ochk input:focus-visible + .box{outline:2px solid var(--pur);outline-offset:2px}
.ochk .ol{font-size:16px}
.ochk .ol small{margin-left:8px;font-size:11px;color:var(--mute);border:1px solid var(--rule);border-radius:4px;padding:0 5px;vertical-align:2px}
.ochk .od{font-size:16px;font-weight:600;color:var(--mute)}
fieldset:disabled .ochk{opacity:.5;cursor:not-allowed}

.ogroup textarea:focus{outline:0;border-color:var(--pur);box-shadow:0 0 0 3px var(--pur-tint)}
.ogroup .cnt{display:block;text-align:right;padding:4px 16px 8px}
.qrow{display:flex;justify-content:space-between;align-items:center;margin:16px 20px 0;padding:12px 16px;background:var(--w);border-radius:8px;font-weight:700;box-shadow:0 1px 2px rgba(27,20,38,.06),0 4px 14px rgba(91,42,134,.06)}
.qrow .step button:disabled{opacity:.4}
.lopt{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.lines .lopt{font-size:12px}
.toast{margin:12px 20px 0}
/* Chinese always renders in Noto Sans TC: form controls and placeholders don't inherit fonts by default */
:root{--cjk:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
html,body,button,input,textarea,select,legend,label{font-family:"Noto Sans TC",system-ui,sans-serif}
input::placeholder,textarea::placeholder{font-family:"Noto Sans TC",system-ui,sans-serif}
.num,.lab,.code,.p,.sum b,.stall .no,.hist .code,.badge,.areatabs .cnt,.stepn{font-family:"Archivo","Noto Sans TC",sans-serif}
.pass .top{grid-template-columns:auto 1fr auto;column-gap:12px}
.pass .top .lab:first-child{grid-column:1/3}
.pass .vend{align-self:end;font-size:15px;line-height:1.2;font-weight:700;color:#fff;padding-bottom:3px;min-width:0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pass .stat{grid-column:3}
.pass .stat b{white-space:nowrap}
.pass .stat b{font-size:22px;padding:9px 16px}
.pass.mini .stat b{font-size:20px;padding:8px 14px}
.passwrap .pass .stat b{font-size:26px;padding:10px 16px}
.passwrap .pass .code{font-size:84px}
.passwrap .pass .top{grid-template-columns:1fr;row-gap:10px}
.passwrap .pass .top .lab:first-child{grid-column:1}
.passwrap .pass .top .lab[style]{display:none}
.passwrap .pass .vend{display:none}
.passwrap .pass .stat{grid-column:1;justify-self:start}

.s-ready .stat b,.s-cancelled .stat b{color:var(--ink)}
.s-ready .top .lab,.s-cancelled .top .lab,.s-ready .stat small,.s-cancelled .stat small{color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

const payName = p => p.type==='card' ? t('cardLast')(p.last4) : t('walletName');
const payLabel = () => defPay() ? payName(defPay()) : `${t('payMethod')}: ${t('notSet')}`;
const newPay = () => S.f.payType==='card' ? {id:'p'+Date.now(),type:'card',last4:S.f.cno.replace(/\D/g,'').slice(-4)} : {id:'p'+Date.now(),type:'wallet'};
const addPay = p => { if(!S.pays.length) p.def=true; S.pays.push(p) };
const heroImg = (s, cls='') => `<div class="himg ${cls}" style="--sc:${s.c}">${I.photo}<span class="phl">${t('phPhoto')}</span></div>`;
const openTxt = s => s.open?`<span class="on">${t('open')}</span>`:`<span class="off">${t('opensAt')(s.opens)}</span>`;
const hero = s => `<section class="hero hb ${s.open?'':'closed'}" style="--sc:${s.c}">${heroImg(s)}
    <div class="hcard"><div class="hrow"><h2>${loc(s.name)}</h2></div>
      <p class="desc">${loc(s.desc)}</p>
      <div class="chips"><span>${loc(s.place)}</span><span class="num">${s.hours}</span><span>${openTxt(s)}</span></div>
      <span class="sample">SAMPLE DATA</span></div></section>`;

const RX = { id:/^\d{9}$/, pw:/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/ };
const pwChecks = v => [v.length>=8, /[A-Za-z]/.test(v), /\d/.test(v), v.length>0 && /^[A-Za-z\d]+$/.test(v)];
const langTog = () => `<div class="tog" role="group" aria-label="${t('lang')}">
      <button type="button" data-a="lang" data-v="zh" aria-pressed="${S.lang==='zh'}" lang="zh-Hant">中</button>
      <button type="button" data-a="lang" data-v="en" aria-pressed="${S.lang==='en'}" lang="en">EN</button></div>`;
const idField = () => {
  const v=S.f.id, bad = S.f.touched.id && !RX.id.test(v) || /\D/.test(v);
  return `<div class="field ${bad?'bad':(RX.id.test(v)?'ok':'')}" data-field="id"><label for="f-id">${t('sid')}</label>
    <div class="input"><input id="f-id" name="sid" class="num" inputmode="numeric" autocomplete="username" maxlength="9" placeholder="112000000" value="${v}" aria-describedby="h-id" aria-invalid="${bad}"></div>
    <span class="hint" id="h-id">${bad?t('sidErr'):t('sidHint')}</span></div>`;
};
const pwField = (mode) => {
  const v=S.f.pw, ck=pwChecks(v), ok=RX.pw.test(v);
  const bad = mode==='login' ? (S.f.touched.pw && !v) : (S.f.touched.pw && !ok);
  return `<div class="field ${bad?'bad':(mode==='signup'&&ok?'ok':'')}" data-field="pw"><label for="f-pw">${t('pw')}</label>
    <div class="input"><input id="f-pw" name="pw" type="${S.f.show?'text':'password'}" autocomplete="${mode==='login'?'current-password':'new-password'}" value="${v}" aria-describedby="h-pw" aria-invalid="${bad}">
      <button type="button" class="eye" data-a="eye" aria-label="${S.f.show?t('pwHide'):t('pwShow')}">${S.f.show?I.eyeOff:I.eye}</button></div>
    ${mode==='signup'
      ? `<ul class="checks" id="h-pw">${t('chk').map((c,i)=>`<li class="${ck[i]?'ok':''}">${ck[i]?I.check:I.dot}${c}</li>`).join('')}</ul>`
      : `<span class="hint" id="h-pw">${bad?t('pwReq'):''}</span>`}</div>`;
};
const authValid = mode => RX.id.test(S.f.id) && (mode==='login' ? S.f.pw.length>0 : RX.pw.test(S.f.pw));
const cardValid = () => S.f.cno.replace(/\D/g,'').length===16 && /^(0[1-9]|1[0-2])\/\d{2}$/.test(S.f.exp) && /^\d{3}$/.test(S.f.cvc);
const payValid = () => S.f.payType==='wallet' || S.f.payType==='later' || (S.f.payType==='card' && cardValid());
const payOptions = () => {
  const ty=S.f.payType;
  const opt=(k,ic,ti,su)=>`<button type="button" class="opt" role="radio" aria-checked="${ty===k}" data-a="payType" data-v="${k}"><span class="oi">${ic}</span><span><b>${ti}</b><small>${su}</small></span><span class="rd"></span></button>`;
  return `<div class="opts" role="radiogroup" aria-label="${t('payTtl')}">
    ${opt('card',I.card,t('optCard'),t('optCardSub'))}
    ${ty==='card'?`<div class="cardform">
      <div class="field"><label for="f-cno">${t('cardNo')}</label><div class="input"><input id="f-cno" class="num" inputmode="numeric" autocomplete="off" maxlength="19" placeholder="0000 0000 0000 0000" value="${S.f.cno}"></div></div>
      <div class="field"><label for="f-exp">${t('exp')}</label><div class="input"><input id="f-exp" class="num" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="MM/YY" value="${S.f.exp}"></div></div>
      <div class="field"><label for="f-cvc">${t('cvc')}</label><div class="input"><input id="f-cvc" class="num" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="000" value="${S.f.cvc}"></div></div>
      <span class="hint" style="grid-column:1/3;margin-top:8px">${t('cardNote')}</span></div>`:''}
    ${opt('wallet',I.wallet,t('optWallet'),t('optWalletSub'))}
    ${ty==='wallet'?`<span class="hint">${t('walletNote')}</span>`:''}
    ${view().v==='payEdit'?'':opt('later',I.clock,t('optLater'),t('optLaterSub'))}
  </div>`;
};
const pwFormValid = () => S.f.cur.length>0 && RX.pw.test(S.f.nw) && S.f.nw===S.f.conf && S.f.nw!==S.f.cur;
const obHead = (n, back) => `<header class="obhead"><div class="bar">${back?`<button class="back" data-a="back" aria-label="${t('back')}" style="color:#fff;width:44px;height:44px;margin-left:-12px;display:grid;place-items:center;border-radius:6px">${I.back}</button>`:'<span></span>'}${langTog()}</div>
  <div class="steps" aria-hidden="true"><i class="on"></i><i class="${n>1?'on':''}"></i></div><span class="stepn">${t('stepN')(n)}</span></header>`;

/* ---------- screens ---------- */
const V = {
  login(){
    const ok = authValid('login');
    return `<div class="auth"><section class="ahero"><div class="bar"><span></span>${langTog()}</div>
      <h1>${t('appName')}</h1><p>${t('tagline')}</p></section>
      <form class="acard" data-form="login" novalidate>
        <h2>${t('signIn')}</h2>
        ${S.authErr==='login'?`<div class="note err" role="alert">${I.alert}<span>${t('loginErr')}</span></div>`:''}
        ${idField()}${pwField('login')}
        <button class="cta inline" type="submit" ${ok&&!S.busy?'':'disabled'} aria-busy="${S.busy}">${S.busy?`<span class="spin" aria-hidden="true"></span>${t('signingIn')}`:t('signIn')}</button>
        <p class="alink">${t('noAcct')} <button type="button" data-a="toSignup">${t('signUp')}</button></p>
        <span class="mock">${t('mockAuth')}</span>
      </form></div>`;
  },
  signup(){
    const ok = authValid('signup');
    return `<div class="auth"><section class="ahero"><div class="bar"><button class="back" data-a="toLogin" aria-label="${t('back')}">${I.back}</button>${langTog()}</div>
      <h1>${t('createAcct')}</h1><p>${t('signUpLead')}</p></section>
      <form class="acard" data-form="signup" novalidate>
        ${S.authErr==='taken'?`<div class="note err" role="alert">${I.alert}<span>${t('takenErr')}</span><button type="button" class="act" data-a="toLogin">${t('signInInstead')}</button></div>`:''}
        ${idField()}${pwField('signup')}
        <button class="cta inline" type="submit" ${ok&&!S.busy?'':'disabled'} aria-busy="${S.busy}">${S.busy?`<span class="spin" aria-hidden="true"></span>${t('creating')}`:t('createAcct')}</button>
        <p class="alink">${t('haveAcct')} <button type="button" data-a="toLogin">${t('signIn')}</button></p>
        <span class="mock">${t('mockAuth')}</span>
      </form></div>`;
  },
  obPay(){
    return obHead(1,true) + `<main><div class="ob">
      <h2>${t('payTtl')}</h2><p class="lead">${t('payLead')}</p>${payOptions()}</div></main>
      <div class="obfoot"><div class="pair"><button class="prev" data-a="obBack">${I.back}${t('prevStep')}</button><button class="cta" data-a="payNext" ${payValid()?'':'disabled'}>${t('cont')}</button></div></div>`;
  },
  payEdit(){
    return header(t('addPayTtl'),{back:true}) + `<main><div class="ob">
      <h2>${t('addPayTtl')}</h2><p class="lead">${t('payLead')}</p>${payOptions()}</div></main>
      <div class="obfoot"><button class="cta" data-a="paySave" ${payValid()?'':'disabled'}>${t('save')}</button></div>`;
  },
  pwChange(){
    const ck=pwChecks(S.f.nw), okNew=RX.pw.test(S.f.nw), same=S.f.nw && S.f.nw===S.f.cur;
    const confBad=S.f.pwTouched.conf && S.f.conf!==S.f.nw;
    const curBad=S.f.pwTouched.cur && !S.f.cur;
    const pwIn=(id,lbl,ac,bad,hint)=>`<div class="field ${bad?'bad':''}" data-field="${id}"><label for="f-${id}">${lbl}</label>
      <div class="input"><input id="f-${id}" type="${S.f.show?'text':'password'}" autocomplete="${ac}" value="${S.f[id]}" aria-invalid="${!!bad}" aria-describedby="h-${id}">
      ${id==='cur'?`<button type="button" class="eye" data-a="eyePw" aria-label="${S.f.show?t('pwHide'):t('pwShow')}">${S.f.show?I.eyeOff:I.eye}</button>`:''}</div>${hint}</div>`;
    return header(t('changePw'),{back:true}) + `<main><form class="ob" data-form="pw" novalidate>
      ${S.authErr==='cur'?`<div class="note err" role="alert" style="margin:0 0 4px">${I.alert}<span>${t('curWrong')}</span></div>`:''}
      ${pwIn('cur',t('curPw'),'current-password',curBad,`<span class="hint" id="h-cur">${curBad?t('pwReq'):''}</span>`)}
      ${pwIn('nw',t('newPw'),'new-password',(S.f.pwTouched.nw&&!okNew)||same,`<ul class="checks" id="h-nw">${t('chk').map((c,i)=>`<li class="${ck[i]?'ok':''}">${ck[i]?I.check:I.dot}${c}</li>`).join('')}</ul><span class="hint same">${same?t('sameAsOld'):''}</span>`)}
      ${pwIn('conf',t('confPw'),'new-password',confBad,`<span class="hint" id="h-conf">${confBad?t('pwMismatch'):''}</span>`)}
      <span class="mock" style="text-align:left;margin-top:16px">${t('mockAuth')}</span>
    </form></main>
    <div class="obfoot"><button class="cta" data-a="pwSave" ${pwFormValid()&&!S.busy?'':'disabled'} aria-busy="${S.busy}">${S.busy?`<span class="spin" aria-hidden="true"></span>${t('saving')}`:t('updatePw')}</button></div>`;
  },
  account(){
    const fl=S.flash; S.flash=null;
    return header(t('myAccount')) + `<main>
      ${fl?`<div class="note ok" role="status">${I.check}<span>${t(fl)}</span></div>`:''}
      <section class="idcard"><div class="top">
        <span class="lab">${t('sid')}</span><span class="lab" style="text-align:right">${t('acctStatus')}</span>
        <span class="code num">${S.user||'—'}</span><div class="stat"><b>${t('verified')}</b></div></div>
        <div class="perf"></div>
        <dl class="fields"><div><dt class="lab">${t('school')}</dt><dd>${t('nthu')}</dd></div><div><dt class="lab">${t('joined')}</dt><dd>${S.joined||'—'}</dd></div></dl>
      </section>
      <div class="sec"><h2>${t('settings')}</h2></div>
      <div class="acct">
        <div class="setrow"><span class="oi">${I.bell}</span><span class="tx"><b id="lbl-notif">${t('notif')}</b><small>${t('notifSub')}</small></span>
          <button class="switch" role="switch" aria-checked="${S.notif}" aria-labelledby="lbl-notif" data-a="toggleNotif"><i></i></button></div>
        <div class="setrow"><span class="oi">${I.lang}</span><span class="tx"><b>${t('lang')}</b><small>${S.lang==='zh'?'中文（繁體）':'English'}</small></span>
          ${langTog().replace('class="tog"','class="tog tog-light"')}</div>
      </div>
      <div class="sec"><h2>${t('security')}</h2></div>
      <div class="acct">
        <button class="setrow navrow" data-a="pwChange"><span class="oi">${I.lock}</span><span class="tx"><b>${t('changePw')}</b><small>${t('changePwSub')}</small></span><span class="chev">${I.chev}</span></button>
      </div>
      <div class="sec"><h2>${t('payMethods')}</h2><span>${S.pays.length?t('nMethods')(S.pays.length):''}</span></div>
      <div class="acct">
        ${S.pays.map(p=>`<div class="setrow"><span class="oi">${p.type==='wallet'?I.wallet:I.card}</span>
          <span class="tx"><b>${payName(p)}${p.def?` <span class="defchip">${t('defaultTag')}</span>`:''}</b><small>${p.def?t('defaultSub'):t('chargeNote')}</small></span>
          <span class="pacts">${p.def?'':`<button class="lnk" data-a="payDef" data-id="${p.id}">${t('makeDefault')}</button>`}<button class="lnk del" data-a="payDel" data-id="${p.id}" aria-label="${t('remove')} ${payName(p)}">${t('remove')}</button></span></div>`).join('')}
        ${S.pays.length?'':`<div class="setrow"><span class="oi">${I.card}</span><span class="tx"><b>${t('noPay')}</b><small>${t('optLaterSub')}</small></span><span></span></div>`}
        <button class="addrow" data-a="payEdit">${I.plus}${t('addPayTtl')}</button>
      </div>
      <button class="signout" data-a="signOut">${t('signOut')}</button>
      <span class="mock">${t('mockAuth')}</span>
      <div style="height:24px"></div>
    </main>` + tabbar('account');
  },
  obNotif(){
    return obHead(2,true) + `<main><div class="ob">
      <h2>${t('notifTtl')}</h2><p class="lead">${t('notifLead')}</p>
      <div class="nprev" aria-hidden="true"><span class="ni">${I.bell}</span>
        <div><div class="nt"><b>${t('appName')}</b><span>${t('nNow')}</span></div><p>${t('nBody')('A-047',t('stallOf')('07',loc(STALL['07'].name)))}</p></div>
        <span class="sample">SAMPLE DATA</span></div>
      <ul class="nlist">${t('nPoints').map(x=>`<li>${I.check}<span>${x}</span></li>`).join('')}</ul>
      <span class="mock" style="text-align:left;margin-top:18px">${t('notifMock')}</span>
    </div></main>
    <div class="obfoot"><div class="pair"><button class="prev" data-a="obBack">${I.back}${t('prevStep')}</button><button class="cta" data-a="notif" data-v="on">${I.bell}${t('allow')}</button></div><button class="skip" data-a="notif" data-v="off">${t('notNow')}</button></div>`;
  },
  stalls(){
    const a = active();
    return header(t('stalls')) + `<main>
      ${a.length?`<div class="sec"><h2>${t('passes')}</h2><span class="sample">SAMPLE DATA</span></div>
        <div class="stack">${a.map(o=>pass(o,'mini')).join('')}</div>`:''}
      <div class="sec"><h2>${t('allStalls')}</h2>${a.length?'':'<span class="sample">SAMPLE DATA</span>'}</div>
      <nav class="tabs areatabs" aria-label="${t('area')}">${AREAS.map(([k,n])=>`<button data-a="area" data-v="${k}" aria-current="${S.area===k}">${loc(n)}<span class="cnt">${k==='all'?STALLS.length:STALLS.filter(x=>x.area===k).length}</span></button>`).join('')}</nav>
      <div class="sgrid" style="padding-top:14px">${STALLS.filter(s=>S.area==='all'||s.area===S.area).map(s=>{const c=cartCount(s.no);return `<button class="scard ${s.open?'':'closed'}" data-a="menu" data-v="${s.no}" style="--sc:${s.c}" aria-label="${loc(s.name)}, ${s.open?t('open'):t('closed')}">
        <span class="img">${I.photo}<span class="phl">${t('phPhoto')}</span></span>
        <span class="body"><span class="nm">${loc(s.name)}</span><span class="mt">${loc(s.place)}</span><span class="mt">${s.hours}</span>
          <span class="st"><span class="${s.open?'on':'off'}">${s.open?t('open'):t('opensAt')(s.opens)}</span>${c?`<span class="cartn">${t('inCart')(c)}</span>`:''}</span></span>
      </button>`}).join('')}</div>
    </main>` + tabbar('stalls');
  },
  menu({no, cat=0}){
    const s = STALL[no], a = active().filter(o=>o.stall===no), lines = cartLines(no), cnt = cartCount(no);
    const fl=S.flash; S.flash=null;
    return header(loc(s.name),{back:true,no:s.no}) + `<main id="scroller">
      ${fl?`<div class="note ok toast" role="status">${I.check}<span>${t(fl)}</span></div>`:''}
      ${hero(s)}
      ${s.open?'':`<div class="note">${I.info}<span>${t('closedBanner')(s.opens)}</span></div>`}
      ${a.length?`<div class="stack" style="padding-top:16px">${a.map(o=>pass(o,'mini')).join('')}</div>`:''}
      <nav class="tabs">${s.cats.map((c,i)=>`<button data-a="cat" data-v="${i}" aria-current="${i===cat}">${loc(c)}</button>`).join('')}</nav>
      ${s.cats.map((c,i)=>`<section id="cat-${i}"><h3 class="cat">${loc(c)}</h3>
        <div class="igrid">${c.items.map(it=>{ const n=itemCount(no,it.id); return `<button class="icard ${it.out?'out':''}" style="--sc:${s.c}" data-a="item" data-id="${it.id}" aria-label="${loc(it)}, $${it.price}${it.out?', '+t('soldOut'):''}${n?', '+t('inCartN')(n):''}">
          <span class="iimg">${I.photo}${it.out?`<span class="sold">${t('soldOut')}</span>`:`<span class="phl">${t('phPhoto')}</span>`}${n?`<span class="incart">${t('inCartN')(n)}</span>`:''}</span>
          <span class="ibody"><span class="nm">${loc(it)}</span>${it.out&&n?`<span class="warn">${t('nowOut')(loc(it))}</span>`:''}
            <span class="ifoot"><span class="p">$${it.price}</span>${it.out||!s.open?'':`<span class="add" aria-hidden="true">${I.plus}</span>`}</span></span>
        </button>`}).join('')}</div></section>`).join('')}
      <div style="height:24px"></div>
    </main>
    ${cnt?`<button class="cta" data-a="checkout" data-v="${no}"><span>${t('checkout')} · ${t('items')(cnt)}</span><span class="num">NT$${cartTotal(lines)}</span></button>`:''}`;
  },
  item({id}){
    const it=ITEM[id], s=STALL[it.stall], f=S.it, opts=OPTS[it.stall]||[];
    const unit=unitOf(it,f.opts), can=!it.out && s.open;
    return header(loc(it),{back:true}) + `<main class="itempage">
      <div class="himg" style="--sc:${s.c}">${I.photo}<span class="phl">${t('phPhoto')}</span>${it.out?`<span class="sold big">${t('soldOut')}</span>`:''}</div>
      <section class="ihead"><h2>${loc(it)}</h2><span class="p num">$${it.price}</span><p class="mt">${loc(s.name)} · ${loc(s.place)}</p><span class="sample">SAMPLE DATA</span></section>
      ${it.out?`<div class="note err" role="alert">${I.alert}<span>${t('itemOut')}</span></div>`:''}
      ${!s.open?`<div class="note">${I.info}<span>${t('closedBanner')(s.opens)}</span></div>`:''}
      ${opts.length?`<fieldset class="ogroup" ${can?'':'disabled'}><legend>${t('customize')}<small>${t('customizeSub')}</small></legend>
        ${opts.map(([oid,zh,en,d,g])=>`<label class="ochk"><input type="checkbox" data-opt="${oid}" ${f.opts.includes(oid)?'checked':''}><span class="box">${I.check}</span><span class="ol">${S.lang==='zh'?zh:en}${g?`<small>${t('pickOne')}</small>`:''}</span><span class="od num">${d?'+$'+d:''}</span></label>`).join('')}
      </fieldset>`:''}
      <div class="ogroup"><label class="legend" for="f-note">${t('noteTtl')}<small>${t('optional')}</small></label>
        <textarea id="f-note" maxlength="60" rows="3" placeholder="${t('notePh')}" ${can?'':'disabled'}>${esc(f.note)}</textarea>
        <span class="hint cnt" id="note-cnt">${f.note.length} / 60</span></div>
      <div class="qrow"><span>${t('qty')}</span><div class="step"><button data-a="iq" data-v="-1" aria-label="${t('less')(loc(it))}" ${f.q<=1||!can?'disabled':''}>${I.minus}</button><output aria-live="polite">${f.q}</output><button data-a="iq" data-v="1" aria-label="${t('more')(loc(it))}" ${f.q>=20||!can?'disabled':''}>${I.plus}</button></div></div>
      <div style="height:16px"></div>
    </main>
    <button class="cta" data-a="addItem" ${can?'':'disabled'}><span>${it.out?t('soldOut'):!s.open?t('closed'):t('addToCart')}</span><span class="num" id="item-total">${can?'NT$'+unit*f.q:''}</span></button>`;
  },
  checkout({no}){
    const s = STALL[no], lines = cartLines(no), bad = lines.filter(l=>l.it.out), cnt = lines.reduce((a,l)=>a+l.q,0);
    if(!lines.length) return header(t('review'),{back:true}) + `<main><div class="empty">${t('emptyCart')}<br><button data-a="back">${t('backMenu')}</button></div></main>`;
    const blocked = bad.length>0 || S.placing;
    return header(t('review'),{back:true}) + `<main>
      <div class="meta"><span>${t('stallOf')(s.no,loc(s.name))} · ${loc(s.place)}</span><span class="sample">SAMPLE DATA</span></div>
      ${S.error?`<div class="note err" role="alert">${I.alert}<span>${S.error==='offline'?t('errOffline'):t('errFail')}</span>${S.error==='offline'?'':`<button class="act" data-a="place" data-v="${no}">${t('retry')}</button>`}</div>`:''}
      ${bad.length?`<div class="note err" role="alert">${I.alert}<span>${t('removeFirst')}</span></div>`:''}

const app = document.getElementById('app');
let lastScreen = null;
let pendingFocus = false; // set before an async busy render so the final render still moves focus
const ZONES = ['.hdr','.ahero','.obhead','.obfoot','.tabbar','.acard','main'];
function focusKey(el){
  if(!el || !app.contains(el) || el===document.body) return null;
  if(el.id) return `#${CSS.escape(el.id)}`;
  const d=el.dataset||{}; if(!d.a && !d.opt) return null;
  const zone = ZONES.find(z=>el.closest(z)) || '';
  if(d.opt) return `[data-opt="${d.opt}"]`;
  return `${zone} [data-a="${d.a}"]` + (d.v!==undefined?`[data-v="${d.v}"]`:'') + (d.id?`[data-id="${d.id}"]`:'') + (d.k?`[data-k="${CSS.escape(d.k)}"]`:'');
}
const busyNow = () => S.busy || S.placing;
function holdFocus(){ if(app.contains(document.activeElement)) pendingFocus = true }
function render(reset){
  const old = app.querySelector('main,.auth'), keep = (!reset && old) ? old.scrollTop : 0;
  const fk = focusKey(document.activeElement), hadFocus = app.contains(document.activeElement);
  document.documentElement.lang = S.lang==='zh'?'zh-Hant':'en';
  const v = view(), screen = JSON.stringify([v.v,v.no,v.id]);
  app.innerHTML = V[v.v](v);
  const m = app.querySelector('main,.auth'); if(m) m.scrollTop = keep;
  // keep keyboard focus: same control if it still exists, otherwise the new screen's heading
  const want = hadFocus || pendingFocus;
  const focusEl = el => { if(!el) return; if(!el.matches('button,input,textarea,select,a,[tabindex]')) el.tabIndex=-1; el.focus({preventScroll:true}) };
  if(!busyNow()){
    const err = app.querySelector('.note.err[role=alert]');
    if(screen!==lastScreen){ if(lastScreen!==null && want) focusEl(app.querySelector('h1') || app.querySelector('main h2, .acard h2')) }
    else if(pendingFocus && err) focusEl(err);
    else if(fk && hadFocus) focusEl(app.querySelector(fk) || app.querySelector('.addrow, main [data-a]'));
    pendingFocus = false;
  }
  lastScreen = screen;
  S.snapId = null;
  renderDemo();
}

app.addEventListener('click', e=>{
  const b = e.target.closest('[data-a]'); if(!b || b.disabled) return;
  const {a,v,id} = b.dataset;
  if(a==='lang'){S.lang=v;render()}
  else if(a==='area'){ S.area=v; render() }
  else if(a==='eye'){ S.f.show=!S.f.show; render(); document.getElementById('f-pw')?.focus() }
  else if(a==='toSignup'){ resetAuth(); S.stack=[{v:'login'},{v:'signup'}]; render(true) }
  else if(a==='toLogin'){ resetAuth(true); S.stack=[{v:'login'}]; render(true) }
  else if(a==='payType'){ S.f.payType=v; render(); if(v==='card') document.getElementById('f-cno')?.focus() }
  else if(a==='payNext'){ if(S.f.payType!=='later') addPay(newPay()); go({v:'obNotif'}) }
  else if(a==='notif'){ S.notif = v==='on'; home({v:'stalls'}) }
  else if(a==='toggleNotif'){ S.notif=!S.notif; render(); say(`${t('notif')}: ${S.notif?t('on'):t('off')}`) }
  else if(a==='payEdit'){ S.f.payType=null; S.f.cno=S.f.exp=S.f.cvc=''; go({v:'payEdit'}) }
  else if(a==='payDef'){ S.pays.forEach(p=>p.def=p.id===id); render() }
  else if(a==='payDel'){ const was=S.pays.find(p=>p.id===id)?.def; S.pays=S.pays.filter(p=>p.id!==id); if(was&&S.pays[0]) S.pays[0].def=true; render() }
  else if(a==='pwChange'){ Object.assign(S.f,{cur:'',nw:'',conf:'',pwTouched:{},show:false}); S.authErr=null; go({v:'pwChange'}) }
  else if(a==='paySave'){ addPay(newPay()); S.flash='payAdded'; back(); say(t('payAdded')) }
  else if(a==='eyePw'){ S.f.show=!S.f.show; app.querySelectorAll('#f-cur,#f-nw,#f-conf').forEach(i=>i.type=S.f.show?'text':'password'); b.innerHTML=S.f.show?I.eyeOff:I.eye; b.setAttribute('aria-label',S.f.show?t('pwHide'):t('pwShow')) }
  else if(a==='pwSave'){ if(!pwFormValid()) return; holdFocus(); S.busy=true; render();
    setTimeout(()=>{ S.busy=false; if(S.failLogin){ S.failLogin=false; S.authErr='cur'; S.f.cur=''; S.f.pwTouched={}; return render() } S.flash='pwUpdated'; back(); say(t('pwUpdated')) },900) }
  else if(a==='signOut'){ S.user=null; S.pays=[]; resetAuth(); home({v:'login'}) }
  else if(a==='back' && view().v==='obPay'){ S.f.id=S.user||''; S.stack=[{v:'login'},{v:'signup'}]; render(true) }
  else if(a==='obBack'){ if(view().v==='obPay'){ S.f.id=S.user||''; S.stack=[{v:'login'},{v:'signup'}]; render(true) } else back() }
  else if(a==='back') back();
  else if(a==='home') home({v});
  else if(a==='menu'){ if(view().v==='pass') S.stack.pop(); go({v:'menu',no:v}) }
  else if(a==='pass') go({v:'pass',id});
  else if(a==='checkout') go({v:'checkout',no:v});
  else if(a==='item'){ S.it={opts:[],note:'',q:1}; go({v:'item',id}) }
  else if(a==='iq'){ S.it.q=Math.min(20,Math.max(1,S.it.q+(+v))); render(); say(`${t('qty')} ${S.it.q}`) }
  else if(a==='addItem'){ const it=ITEM[view().id], k=lineKey(it.id,S.it.opts,S.it.note); META[k]={id:it.id,opts:[...S.it.opts],note:S.it.note.trim()}; cart(it.stall)[k]=(cart(it.stall)[k]||0)+S.it.q; S.flash='addedToCart'; back(); say(t('addedToCart')) }
  else if(a==='linc'){ const m=META[b.dataset.k]; const c=cart(ITEM[m.id].stall); c[b.dataset.k]++; render(); say(`${loc(ITEM[m.id])} × ${c[b.dataset.k]}`) }
  else if(a==='ldec'){ const k=b.dataset.k, it=ITEM[META[k].id], c=cart(it.stall); c[k]--; const q=c[k]; if(q<=0) delete c[k]; render(); say(`${loc(it)} × ${Math.max(q,0)}`) }
  else if(a==='inc'){const it=ITEM[id];cart(it.stall)[id]=(cart(it.stall)[id]||0)+1;render()}
  else if(a==='dec'){const it=ITEM[id],c=cart(it.stall);c[id]=Math.max(0,(c[id]||0)-1);if(!c[id])delete c[id];render()}
  else if(a==='rm'){ const k=b.dataset.k; delete cart(ITEM[META[k].id].stall)[k]; render() }
  else if(a==='cat'){
    view().cat=+v; render();
    const el=document.getElementById('cat-'+v), sc=document.getElementById('scroller');
    if(el&&sc) sc.scrollTo({top:el.offsetTop-52,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  }
  else if(a==='place') place(v);
});

function resetAuth(keepId){ S.authErr=null; S.busy=false; S.f.pw=''; S.f.show=false; S.f.touched={}; if(!keepId) S.f.id='' }
app.addEventListener('change', e=>{
  const el=e.target; if(!el.dataset.opt || view().v!=='item') return;
  const it=ITEM[view().id], o=optOf(it.stall,el.dataset.opt);
  if(el.checked){ if(o.g) S.it.opts=S.it.opts.filter(x=>optOf(it.stall,x)?.g!==o.g); S.it.opts.push(o.id) } else S.it.opts=S.it.opts.filter(x=>x!==o.id);
  app.querySelectorAll('[data-opt]').forEach(c=>c.checked=S.it.opts.includes(c.dataset.opt));
  const tot=document.getElementById('item-total'); if(tot) tot.textContent='NT$'+unitOf(it,S.it.opts)*S.it.q;
});
// live validation without re-rendering (keeps focus and caret)
app.addEventListener('input', e=>{
  const el=e.target, mode=view().v;
  if(el.id==='f-id'){ S.f.id=el.value; if(S.f.id.length===9) S.f.touched.id=true }
  else if(el.id==='f-pw'){ S.f.pw=el.value }
  else if(el.id==='f-cno'){ const d=el.value.replace(/\D/g,'').slice(0,16); el.value=S.f.cno=d.replace(/(\d{4})(?=\d)/g,'$1 ') }
  else if(el.id==='f-exp'){ let d=el.value.replace(/\D/g,'').slice(0,4); el.value=S.f.exp=d.length>2?d.slice(0,2)+'/'+d.slice(2):d }
  else if(el.id==='f-cur'||el.id==='f-nw'||el.id==='f-conf'){ S.f[el.id.slice(2)]=el.value; S.authErr=null; patchPwForm(); return }
  else if(el.id==='f-note'){ S.it.note=el.value; const c=document.getElementById('note-cnt'); if(c) c.textContent=`${el.value.length} / 60`; return }
  else if(el.id==='f-cvc'){ el.value=S.f.cvc=el.value.replace(/\D/g,'').slice(0,3) }
  else return;
  if(mode==='login'||mode==='signup'){ S.authErr=null; patchAuth(mode) }

});
app.addEventListener('focusout', e=>{
  const mode=view().v; if(mode!=='login'&&mode!=='signup') return;
  if(e.target.id==='f-id' && S.f.id){ S.f.touched.id=true; patchAuth(mode) }

});
function patchPwForm(){
  const nw=app.querySelector('[data-field=nw]');
  if(nw){ const ck=pwChecks(S.f.nw); nw.querySelectorAll('.checks li').forEach((li,i)=>{ li.className=ck[i]?'ok':''; li.innerHTML=(ck[i]?I.check:I.dot)+t('chk')[i] });
    const same=S.f.nw&&S.f.nw===S.f.cur; nw.querySelector('.hint.same').textContent=same?t('sameAsOld'):'';
    nw.className='field '+(((S.f.pwTouched.nw&&!RX.pw.test(S.f.nw))||same)?'bad':(RX.pw.test(S.f.nw)?'ok':'')) }
  const conf=app.querySelector('[data-field=conf]');
  if(conf){ const bad=S.f.pwTouched.conf && S.f.conf!==S.f.nw; conf.className='field '+(bad?'bad':(S.f.conf&&S.f.conf===S.f.nw?'ok':'')); conf.querySelector('.hint').textContent=bad?t('pwMismatch'):'' }
  const cur=app.querySelector('[data-field=cur]');
  if(cur){ const bad=S.f.pwTouched.cur&&!S.f.cur; cur.className='field '+(bad?'bad':''); cur.querySelector('.hint').textContent=bad?t('pwReq'):'' }
  app.querySelector('form[data-form=pw] .note.err')?.remove();
  const b=app.querySelector('[data-a=pwSave]'); if(b) b.disabled=!pwFormValid()||S.busy;
}
app.addEventListener('focusout', e=>{
  if(view().v!=='pwChange') return; const k=(e.target.id||'').slice(2);
  if(['cur','nw','conf'].includes(k)){ S.f.pwTouched[k]=true; patchPwForm() }
});
function patchAuth(mode){
  // update validation UI in place so focus, caret and pending clicks are never disturbed
  const idEl=app.querySelector('[data-field=id]');
  if(idEl){ const v=S.f.id, bad=(S.f.touched.id&&!RX.id.test(v))||/\D/.test(v);
    idEl.className='field '+(bad?'bad':(RX.id.test(v)?'ok':''));
    idEl.querySelector('input').setAttribute('aria-invalid',bad);
    idEl.querySelector('.hint').textContent=bad?t('sidErr'):t('sidHint'); }
  const pwEl=app.querySelector('[data-field=pw]');
  if(pwEl){ const v=S.f.pw, ok=RX.pw.test(v), bad = mode==='login' ? (S.f.touched.pw&&!v) : (S.f.touched.pw&&!ok);
    pwEl.className='field '+(bad?'bad':(mode==='signup'&&ok?'ok':''));
    pwEl.querySelector('input').setAttribute('aria-invalid',bad);
    if(mode==='signup'){ const ck=pwChecks(v); pwEl.querySelectorAll('.checks li').forEach((li,i)=>{ li.className=ck[i]?'ok':''; li.innerHTML=(ck[i]?I.check:I.dot)+t('chk')[i] }) }
    else pwEl.querySelector('.hint').textContent=bad?t('pwReq'):''; }
  app.querySelector('.acard .note.err')?.remove();
  const sb=app.querySelector('.acard [type=submit]'); if(sb) sb.disabled=!authValid(mode)||S.busy;
}
app.addEventListener('submit', e=>{
  e.preventDefault(); const mode=e.target.dataset.form;
  S.f.touched={id:true,pw:true};
  if(!authValid(mode)||S.busy){ patchAuth(mode); return }
  holdFocus(); S.busy=true; render();
  setTimeout(()=>{
    S.busy=false;
    if(mode==='login'){
      if(S.failLogin){ S.failLogin=false; S.authErr='login'; S.f.pw=''; S.f.touched={}; return render() }
      S.user=S.f.id; S.joined=S.joined||'2025/9/1'; resetAuth(); home({v:'stalls'});
    } else {
      if(S.idTaken){ S.idTaken=false; S.authErr='taken'; return render() }
      S.user=S.f.id; S.joined=new Date().toLocaleDateString('zh-TW'); resetAuth(); S.f.payType=null; S.f.cno=S.f.exp=S.f.cvc=''; S.stack=[{v:'obPay'}]; render(true);
    }
  },900);
});

function place(no){
  if(S.placing) return;
  holdFocus(); S.placing=true; S.error=null; render();
  setTimeout(()=>{
    S.placing=false;
    if(S.offline){S.error='offline';return render()}
    if(S.failNext){S.failNext=false;S.error='fail';return render()}
    const lines = cartLines(no).map(l=>({id:l.it.id,q:l.q,p:l.unit,opts:l.opts,note:l.note}));
    const o = {id:'A-0'+(seq++),stall:no,lines,status:'confirming',placed:clock(),updated:clock()};
    S.orders.unshift(o); S.carts[no]={}; demoSel=o.id;
    S.stack.pop(); S.stack.push({v:'pass',id:o.id}); render(true);
  },1100);
}

const liveEl = document.getElementById('live');

demo.addEventListener('click', e=>{
